name: Import content

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'import-skip') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import uploaded archive into repository
        env:
          SRC_ZIP: "https://imserver.teamily.ai/im_api/object/3269678878785361/file-1792066722928-ooxaeoc8-173b6526-70.origin.zip"
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 -o /tmp/content.zip "$SRC_ZIP"
          mkdir -p /tmp/raw
          unzip -q -o /tmp/content.zip -d /tmp/raw
          CAND="$(find /tmp/raw -maxdepth 3 -name index.html -printf '%h\n' | head -n1)"
          if [ -z "$CAND" ]; then CAND="/tmp/raw"; fi
          echo "Project root: $CAND"
          ls -la "$CAND"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$CAND"/. .
          rm -f .github/workflows/import.yml
          git config user.name "Teamily Agent"
          git config user.email "agent@teamily.ai"
          git add -A
          git commit -m "Import RentNest static rental marketplace [import-skip]" || echo "no changes to commit"
          git push origin HEAD:main
